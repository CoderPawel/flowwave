name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  node:
    name: Lint, type check, test, and build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OpenAPI contracts are up to date
        run: npm run contracts:check

  database:
    name: Database migrations and API database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowwave
          POSTGRES_PASSWORD: flowwave
          POSTGRES_DB: flowwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowwave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flowwave:flowwave@localhost:5432/flowwave_test
      FLOWWAVE_TEST_DATABASE_URL: postgres://flowwave:flowwave@localhost:5432/flowwave_test
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-migrations.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @flowwave/api

  mobile:
    name: Analyze, test, and build (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
