include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Generated by `flutter gen-l10n`, which still references the SDK's
    # deprecated Material localizations; the app uses material_ui's instead.
    - lib/l10n/generated/**

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
