name: flowwave_mobile
description: "FlowWave mobile app: offline-first personal energy and focus rhythm."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Every dependency is explained in docs/architecture/0009-flutter-mobile-app.md
# and docs/architecture/0015-flutter-app-architecture.md (rule 13).
dependencies:
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true

# Encrypted on-device database (decision 0015): package:sqlite3 bundles
# SQLite3MultipleCiphers instead of plain SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
